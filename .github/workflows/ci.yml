# Checks everything that can be checked without the game files: sb_recomp
# (runtime, recompiler and TinyCC) compiles. The game itself is
# never available in CI (see README.md).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libsdl2-dev libfreetype-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 freetype pkg-config

      - name: Check scripts
        run: |
          bash -n build.sh

      - name: Build sb_recomp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Tests that need no game files
        run: ctest --test-dir build --output-on-failure
