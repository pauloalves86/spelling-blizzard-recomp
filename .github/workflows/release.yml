# Publishes a release when a tag like v0.1.0 is pushed: SpellingBlizzard,
# ready to run, for Linux x86_64 and arm64. No game code is ever in it: the
# program recompiles the player's own copy each time it starts, in memory.
# recomplauncher.json sits at the top of each package for RecompLauncher.
#
# Run it by hand (Actions > Release > Run workflow) to build the packages as
# workflow artifacts without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35), so the program also runs on older systems.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libsdl2-dev libfreetype-dev fonts-liberation2

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4 --target sb_recomp gamefiles_test

      - name: Test (game files reader; compiling in memory on this processor)
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          version=${GITHUB_REF_NAME//\//-}
          name=SpellingBlizzard-$version
          pkg=stage/$name
          mkdir -p "$pkg/fonts" "$pkg/licenses" dist
          cp build/sb_recomp "$pkg/SpellingBlizzard"
          strip "$pkg/SpellingBlizzard"
          cp recomplauncher.json README.md "$pkg/"
          echo "$version" > "$pkg/VERSION"
          # The Liberation fonts stand in for the Windows fonts the game asks for (SIL OFL 1.1).
          for family in Sans Serif Mono; do
            for style in Regular Bold Italic BoldItalic; do
              cp "/usr/share/fonts/truetype/liberation2/Liberation$family-$style.ttf" "$pkg/fonts/"
            done
          done
          cp /usr/share/doc/fonts-liberation2/copyright "$pkg/licenses/Liberation-fonts.txt"
          cp third_party/tinycc/COPYING "$pkg/licenses/TinyCC-LGPL-2.1.txt"

          # Smoke tests: it runs, compiles in memory, refuses a missing copy (65),
          # and every library it needs is found.
          "$pkg/SpellingBlizzard" --self-test
          set +e
          "$pkg/SpellingBlizzard" --prepare --game=/nonexistent --data "$RUNNER_TEMP/data"
          test $? -eq 65 || exit 1
          set -e
          ldd "$pkg/SpellingBlizzard"
          if ldd "$pkg/SpellingBlizzard" | grep -qi "not found"; then exit 1; fi

          tar czf "dist/$name-linux-${{ matrix.arch }}.tar.gz" -C stage "$name"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}-linux-${{ matrix.arch }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Source package and checksums
        run: |
          version=${GITHUB_REF_NAME//\//-}
          name=SpellingBlizzard-$version
          mkdir -p stage
          git archive --prefix="$name/" HEAD | tar x -C stage
          git -C third_party/tinycc archive --prefix="$name/third_party/tinycc/" HEAD | tar x -C stage
          (cd stage && zip -qr "../dist/$name-source.zip" "$name")
          (cd dist && sha256sum * > "$name.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          You need your own copy of Spelling Blizzard 1.10.CD for Windows: the CD image
          (.iso, or a .bin with its .cue), or the folder with `BLIZZARD.EXE` and
          `SB_CDRES.DLL`. Nothing from the game is in this release: the program
          recompiles your copy each time it starts, in about a tenth of a second,
          in memory. It needs the SDL2 and FreeType libraries, which almost every
          Linux desktop and the Steam Deck already have.

          With [RecompLauncher](https://recomplauncher.com), pick your copy and press Set Up, then Play.
          By hand:

          ```sh
          tar xf SpellingBlizzard-*-linux-x86_64.tar.gz && cd SpellingBlizzard-*/
          ./SpellingBlizzard --prepare --game=/path/to/your/copy.iso
          ./SpellingBlizzard
          ```
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes --verify-tag
