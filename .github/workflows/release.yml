# Publishes a release when a tag like v0.1.0 is pushed. The release holds the
# source package only: the recompiled game is built by each player from their
# own copy of the game (./build.sh), so no game code is ever distributed.
#
# Run it by hand (Actions > Release > Run workflow) to build the package as a
# workflow artifact without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source package
        run: |
          version=${GITHUB_REF_NAME//\//-}
          name=spelling-blizzard-recomp-$version
          mkdir dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" HEAD
          git archive --format=zip --prefix="$name/" -o "dist/$name.zip" HEAD
          (cd dist && sha256sum * > SHA256SUMS)
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          This release contains source only. You need your own copy of Spelling Blizzard
          (`BLIZZARD.EXE` and `SB_CDRES.DLL`, version 1.10.CD for Windows). The build
          recompiles the game on your machine.

          ```sh
          tar xf spelling-blizzard-recomp-*.tar.gz && cd spelling-blizzard-recomp-*/
          ./build.sh /path/to/your/game
          build/release/sb_recomp
          ```

          See README.md for the packages to install first.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes --verify-tag
